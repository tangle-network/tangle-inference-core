[package]
name = "tangle-inference-core"
version = "0.1.0"
edition = "2021"
description = "Shared infrastructure for Tangle inference blueprints"

[features]
default = ["billing", "http", "metrics"]
billing = ["dep:alloy", "dep:k256", "dep:hex", "dep:async-trait"]
http = ["dep:axum", "dep:tower-http", "dep:blueprint-keystore", "dep:zeroize"]
metrics = ["dep:prometheus"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blueprint-core = { git = "https://github.com/tangle-network/blueprint", rev = "74801e0e62a5918f63ef471efa8e975fa8c8e3b2", default-features = false }
blueprint-tee = { version = "=0.2.0-alpha.11", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"

alloy = { version = "=2.1.1", features = ["provider-http", "signer-local", "contract", "sol-types"], optional = true }
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
hex = { version = "0.4", optional = true }
async-trait = { version = "0.1", optional = true }

blueprint-keystore = { version = "=0.2.0-alpha.15", default-features = false, features = ["std", "ecdsa"], optional = true }
zeroize = { version = "1", optional = true }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"], optional = true }

prometheus = { version = "0.13", default-features = false, optional = true }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
